			shellScript = "# Strip simulator platform slices AND raise low deployment targets on embedded\n# frameworks this project cannot fix at the source.\n#\n# Two problems, one cause, one tool (vtool):\n#\n# 1) A framework tagged IOSSIMULATOR/MACCATALYST inside a DEVICE build.\n#    Originally objective_c.framework. Fixes App Store validation error:\n#    'references an unsupported platform in the arm64 slice'.\n#\n# 2) A framework whose own minos is below App Store Connect's current floor\n#    (\"The iOS deployment target 'IPHONEOS_DEPLOYMENT_TARGET' is set to\n#    13.0, but the range of supported deployment target versions is 15.0 to\n#    27.0.x.\"). Every pod we compile from source picks this up automatically\n#    via the Podfile's post_install (which forces IPHONEOS_DEPLOYMENT_TARGET\n#    to match this project's own setting), and Runner/RunnerTests pick it up\n#    from the Xcode project directly -- but a few frameworks are vendored\n#    prebuilt binaries that neither of those paths ever touches: Flutter's\n#    own engine framework (Flutter.framework, baked by the Flutter SDK\n#    itself), the Dart-generated App.framework, and objective_c.framework\n#    (the FFI interop package's shipped xcframework). Those still need\n#    both their Mach-O minos AND their own Info.plist's MinimumOSVersion\n#    bumped here, same as the platform re-tag below (App Store Connect\n#    error 90208 checks the latter separately from the former).\n#\n# DEVICE BUILDS ONLY. CODESIGNING_FOLDER_PATH is set on every build, not just on\n# archive, so without this guard the phase also runs for `flutter build ios --simulator`.\n# There every embedded framework is *legitimately* tagged IOSSIMULATOR, and re-tagging\n# it as iOS makes dyld refuse to load it at launch:\n#   Library not loaded: @rpath/<X>.framework/<X>\n#   Reason: ... incompatible platform (have 'iOS', need 'iOS-simulator')\ncase \"${PLATFORM_NAME}\" in\n  *simulator*)\n    echo \"Strip Simulator Slices: skipping, simulator build (PLATFORM_NAME=${PLATFORM_NAME})\"\n    exit 0\n    ;;\nesac\nTARGET=\"${IPHONEOS_DEPLOYMENT_TARGET:-15.0}\"\nfind \"${CODESIGNING_FOLDER_PATH}/Frameworks\" -name '*.framework' -type d 2>/dev/null | while read -r fw; do\n  binary=\"$fw/$(basename \"$fw\" .framework)\"\n  [ -f \"$binary\" ] || continue\n  info=$(xcrun vtool -show-build \"$binary\" 2>/dev/null)\n  needs_fix=0\n  echo \"$info\" | grep -qE 'IOSSIMULATOR|MACCATALYST' && needs_fix=1\n  for minos in $(echo \"$info\" | awk '/minos/{print $2}'); do\n    awk -v v=\"$minos\" -v t=\"$TARGET\" 'BEGIN{exit !(v+0<t+0)}' && needs_fix=1\n  done\n  if [ \"$needs_fix\" = \"1\" ]; then\n    echo \"Strip Simulator Slices: re-tagging $binary as iOS $TARGET (was $(echo \"$info\" | grep -E 'platform|minos' | tr '\\n' ' ' | sed 's/  */ /g'))\"\n    xcrun vtool -set-build-version ios \"$TARGET\" \"$TARGET\" -replace -output \"$binary\" \"$binary\"\n    # The Mach-O load command isn't the only place a deployment target lives:\n    # the framework's own Info.plist carries a separate MinimumOSVersion key,\n    # and App Store Connect cross-checks the two (error 90208: \"the bundle\n    # ... does not support the minimum OS Version specified in the\n    # Info.plist\"). A pod we compile from source gets this synced by Xcode's\n    # normal product packaging automatically; these vendored frameworks don't\n    # go through that, so it's still whatever version they shipped with\n    # (13.0) even after the line above fixes the binary itself.\n    plist=\"$fw/Info.plist\"\n    if [ -f \"$plist\" ]; then\n      if /usr/libexec/PlistBuddy -c \"Print :MinimumOSVersion\" \"$plist\" >/dev/null 2>&1; then\n        /usr/libexec/PlistBuddy -c \"Set :MinimumOSVersion $TARGET\" \"$plist\"\n      else\n        /usr/libexec/PlistBuddy -c \"Add :MinimumOSVersion string $TARGET\" \"$plist\"\n      fi\n    fi\n  fi\ndone\n";
		};
/* End PBXShellScriptBuildPhase section */

